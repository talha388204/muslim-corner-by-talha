    <rect x="40" y="40" width="480" height="720" rx="12" fill="url(#coverGrad)" filter="url(#ds)"/>
    <rect x="40" y="40" width="480" height="80" rx="12" fill="rgba(255,255,255,0.04)"/>
    <text x="300" y="320" text-anchor="middle" fill="#ffffff" font-family="Noto Sans, Arial, sans-serif" style="font-weight:700;">
      <tspan x="300" dy="0" font-size="40" font-weight="700">ইসলামের</tspan>
      <tspan x="300" dy="56" font-size="40" font-weight="700">কেন্দ্রবিন্দু</tspan>
    </text>
    <text x="300" y="520" text-anchor="middle" fill="#f3e7e7" font-size="20" font-family="Noto Sans, Arial, sans-serif">ড. জাকির নায়েক</text>
